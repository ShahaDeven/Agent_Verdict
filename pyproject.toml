[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-verdict"
version = "0.1.0"
description = "Muse Ember as a cheap, always-on judge of AI agent runs, with a review queue for the runs it is unsure about"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=2.0",
    "pillow>=10.1",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
agent-verdict = "agent_verdict.cli:main"

[tool.setuptools]
packages = ["agent_verdict", "ember_core"]
